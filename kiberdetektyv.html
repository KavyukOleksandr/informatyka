<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Юний кібердетектив</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b2740;
    --ink-deep:#101828;
    --cork:#7a5236;
    --cork-dark:#5e3f29;
    --paper:#f4ecd8;
    --paper-edge:#e6d8b8;
    --mustard:#e0a83a;
    --mustard-dark:#b8811e;
    --danger:#c1443b;
    --danger-dark:#8f2f28;
    --safe:#4c7a51;
    --safe-dark:#365a3a;
    --string:#a32e27;
    --text-dark:#2a2116;
    --text-mute:#6b5d47;
    --shadow: 0 10px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito',sans-serif;
    background:
      radial-gradient(circle at 20% 20%, rgba(0,0,0,0.12) 0, transparent 40%),
      radial-gradient(circle at 80% 60%, rgba(0,0,0,0.14) 0, transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(0,0,0,0.1) 0, transparent 40%),
      repeating-linear-gradient(0deg, var(--cork), var(--cork) 2px, var(--cork-dark) 3px, var(--cork) 4px),
      var(--cork);
    color:var(--text-dark);
    min-height:100vh;
    padding:20px 14px 60px;
    display:flex;
    justify-content:center;
  }
  #app{width:100%;max-width:760px;}

  .home{
    display:inline-block;
    margin-bottom:10px;
    color:var(--paper);
    font-weight:800;
    font-size:14px;
    text-decoration:none;
    opacity:.9;
  }
  .home:hover{text-decoration:underline;opacity:1;}

  .brand{
    text-align:center;
    color:var(--paper);
    font-family:'Special Elite',monospace;
    font-size:14px;
    letter-spacing:.5px;
    opacity:.85;
    margin-bottom:14px;
  }
  .brand span{color:var(--mustard);}

  .timerbar{
    text-align:center;
    font-family:'Special Elite',monospace;
    color:var(--mustard);
    font-size:15px;
    margin-bottom:8px;
    letter-spacing:.5px;
  }

  #studentName{margin-bottom:4px;}
  .name-warn{color:var(--danger-dark);font-size:13px;margin:4px 0 0;display:none;}
  .name-warn.show{display:block;}

  /* progress board */
  .board{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0;
    margin:0 auto 22px;
    max-width:520px;
    padding:14px 10px;
  }
  .pin-wrap{display:flex;align-items:center;flex:1;}
  .pin{
    width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Special Elite',monospace;
    font-size:14px;
    background:var(--ink-deep);
    color:var(--paper-edge);
    border:2px solid var(--ink-deep);
    flex:0 0 auto;
    position:relative;
    z-index:2;
    transition:transform .25s ease, background .25s ease;
  }
  .pin.done{background:var(--safe);border-color:var(--safe-dark);color:#fff;}
  .pin.active{background:var(--mustard);border-color:var(--mustard-dark);color:var(--ink-deep);transform:scale(1.18);}
  .thread{flex:1;height:3px;background:var(--string);opacity:.55;margin:0 -2px;position:relative;top:0;}
  .thread.done{opacity:.95;}

  /* card */
  .card{
    background:var(--paper);
    border-radius:3px;
    box-shadow:var(--shadow);
    padding:30px 26px 26px;
    position:relative;
    border:1px solid var(--paper-edge);
  }
  .card::before{
    content:"";
    position:absolute;
    top:-13px;left:50%;
    transform:translateX(-50%) rotate(-3deg);
    width:26px;height:26px;
    background:radial-gradient(circle at 35% 30%, #f3d68a, var(--mustard-dark));
    border-radius:50%;
    box-shadow:0 3px 4px rgba(0,0,0,.4);
  }
  .case-tag{
    font-family:'Special Elite',monospace;
    color:var(--mustard-dark);
    font-size:13px;
    margin-bottom:6px;
  }
  h1,h2{
    font-family:'Special Elite',monospace;
    line-height:1.25;
    margin:0 0 14px;
    color:var(--text-dark);
  }
  h1{font-size:26px;}
  h2{font-size:21px;}
  p{line-height:1.55;color:var(--text-dark);}
  .lede{color:var(--text-mute);font-size:15px;}

  .btn{
    font-family:'Nunito',sans-serif;
    font-weight:800;
    font-size:15px;
    border:none;
    border-radius:8px;
    padding:12px 22px;
    cursor:pointer;
    color:#fff;
    background:var(--ink);
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
    box-shadow:0 3px 0 var(--ink-deep);
  }
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink-deep);}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
  .btn.gold{background:var(--mustard);color:var(--ink-deep);box-shadow:0 3px 0 var(--mustard-dark);}
  .btn.safe{background:var(--safe);box-shadow:0 3px 0 var(--safe-dark);}
  .btn.danger{background:var(--danger);box-shadow:0 3px 0 var(--danger-dark);}
  .btn.ghost{background:transparent;color:var(--text-dark);box-shadow:none;border:2px solid var(--paper-edge);}
  .btn:focus-visible, .choice-btn:focus-visible, .opt-card:focus-visible{outline:3px solid var(--mustard-dark);outline-offset:2px;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;justify-content:flex-end;}

  /* case1 password ranking */
  .pw-list{list-style:none;margin:16px 0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .pw-item{
    display:flex;align-items:center;gap:10px;
    background:#fff;border:2px solid var(--paper-edge);border-radius:8px;
    padding:10px 12px;
    transition:border-color .2s ease, background .2s ease;
  }
  .pw-item .pw-pos{
    font-family:'Special Elite',monospace;
    width:22px;text-align:center;color:var(--text-mute);flex:0 0 auto;
  }
  .pw-item code{
    flex:1;font-family:'Special Elite',monospace;font-size:15px;
    word-break:break-all;
  }
  .pw-arrows{display:flex;flex-direction:column;gap:2px;}
  .pw-arrows button{
    background:var(--ink);color:#fff;border:none;border-radius:5px;
    width:26px;height:22px;cursor:pointer;font-size:12px;line-height:1;
  }
  .pw-arrows button:disabled{opacity:.25;cursor:not-allowed;}
  .pw-item.correct{border-color:var(--safe);background:#eef7ee;}
  .pw-item.wrong{border-color:var(--danger);background:#fbeceb;}

  .checklist{list-style:none;padding:0;margin:10px 0 4px;display:grid;gap:6px;}
  .checklist li{font-size:14px;color:var(--text-mute);display:flex;gap:8px;align-items:center;}
  .checklist li.ok{color:var(--safe-dark);font-weight:700;}
  .checklist .dot{width:9px;height:9px;border-radius:50%;background:var(--paper-edge);flex:0 0 auto;}
  .checklist li.ok .dot{background:var(--safe);}
  input[type=text]{
    width:100%;font-family:'Special Elite',monospace;font-size:16px;
    padding:11px 12px;border-radius:8px;border:2px solid var(--paper-edge);
    background:#fff;color:var(--text-dark);
  }
  input[type=text]:focus{outline:none;border-color:var(--mustard-dark);}

  /* case2 messages */
  .msg{
    background:#fff;border:2px solid var(--paper-edge);border-radius:10px;
    padding:14px 16px;margin-bottom:12px;
  }
  .msg p{margin:0 0 10px;font-size:15px;}
  .msg .choices{display:flex;gap:10px;}
  .choice-btn{
    flex:1;font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;
    padding:9px 6px;border-radius:7px;cursor:pointer;border:2px solid transparent;
    background:var(--paper);color:var(--text-dark);
  }
  .choice-btn.pick-safe{border-color:var(--safe);}
  .choice-btn.pick-danger{border-color:var(--danger);}
  .choice-btn:disabled{cursor:not-allowed;}
  .choice-btn.chosen-safe{background:var(--safe);color:#fff;}
  .choice-btn.chosen-danger{background:var(--danger);color:#fff;}
  .feedback{margin-top:10px;font-size:14px;border-radius:7px;padding:9px 11px;display:none;}
  .feedback.show{display:block;}
  .feedback.good{background:#eaf5eb;color:var(--safe-dark);}
  .feedback.bad{background:#fbeceb;color:var(--danger-dark);}

  /* case3 chat */
  .chat{display:flex;flex-direction:column;gap:8px;margin:16px 0;}
  .bubble{max-width:80%;padding:10px 14px;border-radius:14px;font-size:15px;line-height:1.4;}
  .bubble.them{background:#e7e0cd;align-self:flex-start;border-bottom-left-radius:4px;}
  .bubble.me{background:var(--ink);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
  .who{font-size:11px;color:var(--text-mute);margin:2px 4px 0;}
  .who.me-who{align-self:flex-end;}

  .opt-card{
    display:block;width:100%;text-align:left;
    background:#fff;border:2px solid var(--paper-edge);border-radius:8px;
    padding:12px 14px;margin-bottom:10px;font-size:15px;cursor:pointer;
    font-family:'Nunito',sans-serif;color:var(--text-dark);font-weight:700;
  }
  .opt-card:disabled{cursor:not-allowed;}
  .opt-card.correct-pick{background:var(--safe);border-color:var(--safe-dark);color:#fff;}
  .opt-card.wrong-pick{background:var(--danger);border-color:var(--danger-dark);color:#fff;}

  /* case4 sorting */
  .sit{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:#fff;border:2px solid var(--paper-edge);border-radius:8px;
    padding:10px 12px;margin-bottom:8px;
  }
  .sit span{font-size:14.5px;flex:1;}
  .sit .sit-btns{display:flex;gap:6px;flex:0 0 auto;}
  .mini-btn{
    border:2px solid var(--paper-edge);background:#fff;border-radius:7px;
    padding:6px 10px;font-size:16px;cursor:pointer;
  }
  .mini-btn.sel-safe{background:var(--safe);border-color:var(--safe-dark);}
  .mini-btn.sel-danger{background:var(--danger);border-color:var(--danger-dark);}
  .sit.result-correct{border-color:var(--safe);}
  .sit.result-wrong{border-color:var(--danger);}
  .sit-hint{font-size:12px;margin-top:2px;color:var(--text-mute);width:100%;display:none;}
  .sit.show-hint .sit-hint{display:block;}

  /* case5 sequence */
  .pool{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;}
  .pool-item{
    background:#fff;border:2px solid var(--paper-edge);border-radius:8px;
    padding:9px 12px;font-size:14px;cursor:pointer;font-weight:700;
  }
  .pool-item.used{opacity:.35;cursor:not-allowed;}
  .slots{display:flex;flex-direction:column;gap:8px;margin:16px 0;}
  .slot{
    min-height:44px;border:2px dashed var(--paper-edge);border-radius:8px;
    display:flex;align-items:center;gap:10px;padding:6px 12px;
    font-size:14px;color:var(--text-mute);cursor:pointer;
  }
  .slot.filled{border-style:solid;border-color:var(--mustard-dark);color:var(--text-dark);background:#fff;}
  .slot .num{font-family:'Special Elite',monospace;color:var(--mustard-dark);}
  .slot.slot-correct{border-color:var(--safe);background:#eef7ee;}
  .slot.slot-wrong{border-color:var(--danger);background:#fbeceb;}

  .score-line{font-size:13px;color:var(--text-mute);margin-top:14px;}

  .site-footer{
    text-align:center;
    color:var(--paper);
    opacity:.7;
    font-size:12.5px;
    margin-top:26px;
    line-height:1.6;
  }

  /* results */
  .rank-title{font-family:'Special Elite',monospace;font-size:22px;color:var(--mustard-dark);margin:6px 0 4px;}
  .badges{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0;}
  .badge{
    flex:1 1 130px;background:#fff;border:2px solid var(--paper-edge);border-radius:10px;
    padding:12px;text-align:center;
  }
  .badge .num{font-family:'Special Elite',monospace;font-size:20px;display:block;}
  .badge .lbl{font-size:12px;color:var(--text-mute);}
  .totalscore{
    text-align:center;font-family:'Special Elite',monospace;font-size:44px;color:var(--ink);margin:8px 0 0;
  }
  .totalscore small{font-family:'Nunito',sans-serif;font-size:15px;color:var(--text-mute);display:block;font-weight:700;}

  .intro-list{padding-left:0;list-style:none;margin:16px 0;}
  .intro-list li{padding:6px 0;font-size:15px;border-bottom:1px dashed var(--paper-edge);}

  @media (max-width:480px){
    .card{padding:22px 16px 20px;}
    h1{font-size:22px;}
    .badge{flex:1 1 100px;}
  }
</style>
</head>
<body>
<div id="app">
  <a class="home" href="./">← Усі ігри</a>
  <div class="brand">🕵️ ЮНИЙ <span>КІБЕРДЕТЕКТИВ</span> · 5 клас</div>
  <div id="boardWrap"></div>
  <div id="screen" class="card"></div>
  <div class="site-footer">Володимирська гімназія №3<br>Вчитель інформатики Кавюк О.В.</div>
</div>

<script>
(function(){
  "use strict";

  var CASES = [
    {n:1, icon:"🔐", title:"Надійний пароль"},
    {n:2, icon:"🎣", title:"Спіймай шахрая"},
    {n:3, icon:"👤", title:"Хто за екраном?"},
    {n:4, icon:"📸", title:"Можна це публікувати?"},
    {n:5, icon:"🆘", title:"План порятунку"}
  ];

  var state = {
    screen: "intro",
    scores: {1:{c:0,t:5}, 2:{c:0,t:5}, 3:{c:0,t:1}, 4:{c:0,t:6}, 5:{c:0,t:4}},
    doneCases: {},
    studentName: "",
    startTime: null,
    elapsedSeconds: 0,
    finished: false,
    submitted: false
  };

  // ---------- GOOGLE FORM CONFIG ----------
  // Щоб результати учнів автоматично потрапляли в Google Таблицю,
  // впишіть сюди адресу форми та entry-номери полів (див. інструкцію).
  // Якщо formActionUrl лишити порожнім — квест працює як завжди,
  // просто нічого нікуди не надсилає.
  var FORM_CONFIG = {
    formActionUrl: "https://docs.google.com/forms/d/e/1FAIpQLSe4tYZuY3qcDj-6XS5uhVOraD72tHGqjhS-wjycHtadiMw6Ww/formResponse",
    entryName:    "entry.1268770080",
    entryScore:   "entry.178001362",
    entryPercent: "entry.39363199",
    entryTime:    "entry.313026840"
  };

  function formatTime(totalSeconds){
    var m = Math.floor(totalSeconds/60);
    var s = totalSeconds%60;
    return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
  }

  function submitResults(){
    if (state.submitted) return;
    if (!FORM_CONFIG.formActionUrl) return;
    state.submitted = true;
    var total=0, max=0;
    CASES.forEach(function(c){ total += state.scores[c.n].c; max += state.scores[c.n].t; });
    var pct = max ? Math.round(total/max*100) : 0;
    var body = new URLSearchParams();
    if (FORM_CONFIG.entryName)    body.append(FORM_CONFIG.entryName, state.studentName || "Невідомо");
    if (FORM_CONFIG.entryScore)   body.append(FORM_CONFIG.entryScore, total+"/"+max);
    if (FORM_CONFIG.entryPercent) body.append(FORM_CONFIG.entryPercent, pct+"%");
    if (FORM_CONFIG.entryTime)    body.append(FORM_CONFIG.entryTime, formatTime(state.elapsedSeconds));
    fetch(FORM_CONFIG.formActionUrl, {method:"POST", mode:"no-cors", body: body}).catch(function(){});
  }

  // ---------- CASE 1 DATA ----------
  var pwOrder = [
    {id:"p1", text:"123456"},
    {id:"p2", text:"qwerty"},
    {id:"p3", text:"Sasha2014"},
    {id:"p4", text:"Pizza!"},
    {id:"p5", text:"K8!mP2#vL9@x"}
  ];
  var pwCorrectIds = ["p1","p2","p3","p4","p5"];
  var pwUserOrder = shuffle(pwOrder.map(function(p){return p.id;}));
  var pwChecked = false;
  var pwPasswordOk = false;

  // ---------- CASE 2 DATA ----------
  var messages = [
    {id:1, text:"🎁 Вітаємо! Ви виграли iPhone! Перейдіть за посиланням та введіть пароль від свого акаунта.", danger:true,
      why:"Небезпечно! Обіцянка призу нізвідки та прохання ввести пароль — класична пастка шахраїв."},
    {id:2, text:"Привіт! Це твій однокласник. Можеш скинути домашнє завдання?", danger:false,
      why:"Безпечно. Просте прохання без тиску і без запиту паролів чи особистих даних."},
    {id:3, text:"⚠️ ТЕРМІНОВО! Ваш акаунт буде заблоковано через 10 хвилин! Введіть пароль для підтвердження.", danger:true,
      why:"Небезпечно! Повідомлення квапить тебе діяти швидко і просить пароль — це ознака шахрайства."},
    {id:4, text:"Завтра контрольна. Не забудь підготуватися 🙂", danger:false,
      why:"Безпечно. Звичайне нагадування, жодних підозрілих прохань."},
    {id:5, text:"🎮 Отримай безкоштовні 10 000 монет у грі! Введи логін і пароль.", danger:true,
      why:"Небезпечно! Знову ловлять на «безкоштовному подарунку» і виманюють пароль."}
  ];
  var msgAnswers = {};

  // ---------- CASE 3 DATA ----------
  var chatStep = 0;
  var chatLines = [
    {who:"them", name:"Alex_777", text:"Привіт! Як тебе звати?"},
    {who:"me", name:"Ти", text:"Максим."},
    {who:"them", name:"Alex_777", text:"Скільки тобі років?"},
    {who:"me", name:"Ти", text:"11."},
    {who:"them", name:"Alex_777", text:"А де ти живеш? Назви вулицю і номер будинку 🙂"}
  ];
  var chatOptions = [
    {id:"a", text:"Сказати адресу", correct:false},
    {id:"b", text:"Не повідомляти й припинити спілкування", correct:true},
    {id:"c", text:"Запитати, де живе він", correct:false}
  ];
  var chatAnswered = false;

  // ---------- CASE 4 DATA ----------
  var situations = [
    {id:1, text:"Фото свого малюнка", safe:true},
    {id:2, text:"Фото друга без його дозволу", safe:false},
    {id:3, text:"Фото з номером будинку", safe:false},
    {id:4, text:"Фото свого домашнього улюбленця", safe:true},
    {id:5, text:"Фото документа", safe:false},
    {id:6, text:"Фото з класного заходу, де всі погодилися", safe:true}
  ];
  var sitAnswers = {};
  var sitChecked = false;

  // ---------- CASE 5 DATA ----------
  var pool5 = [
    {id:"a", text:"Негайно припинити спілкування", correct:true, order:1},
    {id:"b", text:"Зробити скриншот переписки", correct:true, order:2},
    {id:"c", text:"Заблокувати користувача", correct:true, order:3},
    {id:"d", text:"Розповісти дорослому (батькам або вчителю)", correct:true, order:4},
    {id:"e", text:"Відповісти погрозою у відповідь", correct:false, order:0},
    {id:"f", text:"Погодитися на зустріч", correct:false, order:0}
  ];
  var pool5shuffled = shuffle(pool5.slice());
  var slots5 = [null, null, null, null];
  var slots5checked = false;

  function shuffle(arr){
    var a = arr.slice();
    for (var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }

  // ---------------- RENDER BOARD ----------------
  function renderBoard(){
    var wrap = document.getElementById("boardWrap");
    if (state.screen === "intro"){ wrap.innerHTML = ""; return; }
    if (state.screen === "result"){
      wrap.innerHTML = '<div class="timerbar">⏱ Час розслідування: '+formatTime(state.elapsedSeconds)+'</div>';
      return;
    }
    var html = '<div class="timerbar">⏱ <span id="liveClock">'+formatTime(state.startTime ? Math.floor((Date.now()-state.startTime)/1000) : 0)+'</span></div>';
    html += '<div class="board">';
    CASES.forEach(function(c, idx){
      var cls = "pin";
      if (state.doneCases[c.n]) cls += " done";
      else if (state.screen === "case"+c.n) cls += " active";
      html += '<div class="pin-wrap">';
      html += '<div class="'+cls+'">'+(state.doneCases[c.n] ? "✓" : c.n)+'</div>';
      if (idx < CASES.length-1){
        html += '<div class="thread'+(state.doneCases[c.n]?' done':'')+'"></div>';
      }
      html += '</div>';
    });
    html += '</div>';
    wrap.innerHTML = html;
  }

  // ---------------- SCREENS ----------------
  function renderIntro(){
    return ''
    +'<div class="case-tag">СПРАВА ВІДКРИТА</div>'
    +'<h1>🕵️ Ти — кібердетектив</h1>'
    +'<p>Твоє завдання — допомогти персонажам безпечно користуватися Інтернетом. У кожній справі є небезпека, і тільки ти можеш її розпізнати.</p>'
    +'<ul class="intro-list">'
      +CASES.map(function(c){return '<li>'+c.icon+' Справа №'+c.n+' — '+c.title+'</li>';}).join('')
    +'</ul>'
    +'<label style="display:block;margin:16px 0 6px;font-weight:800;font-size:14px;" for="studentName">Як тебе звати?</label>'
    +'<input type="text" id="studentName" placeholder="Ім'+"'"+'я та прізвище" autocomplete="off" value="'+esc(state.studentName)+'">'
    +'<p class="name-warn" id="nameWarn">Спершу впиши своє ім'+"'"+'я, детективе 🙂</p>'
    +'<div class="btn-row"><button class="btn gold" data-action="start">Почати розслідування</button></div>';
  }

  // ---- CASE 1 ----
  function renderCase1(){
    var itemsHtml = pwUserOrder.map(function(id, idx){
      var pw = pwOrder.filter(function(p){return p.id===id;})[0];
      var cls = "pw-item";
      if (pwChecked){
        cls += (pwCorrectIds[idx] === id) ? " correct" : " wrong";
      }
      return ''
      +'<li class="'+cls+'" data-id="'+id+'">'
        +'<span class="pw-pos">'+(idx+1)+'</span>'
        +'<code>'+esc(pw.text)+'</code>'
        +'<div class="pw-arrows">'
          +'<button data-arrow="up" data-id="'+id+'" '+(idx===0?"disabled":"")+'>▲</button>'
          +'<button data-arrow="down" data-id="'+id+'" '+(idx===pwUserOrder.length-1?"disabled":"")+'>▼</button>'
        +'</div>'
      +'</li>';
    }).join('');

    var correctCount = pwUserOrder.filter(function(id,idx){return id===pwCorrectIds[idx];}).length;

    var crit = passwordCriteria(document.getElementById("newpw") ? document.getElementById("newpw").value : "");

    return ''
    +'<div class="case-tag">СПРАВА №1</div>'
    +'<h1>🔐 Надійний пароль</h1>'
    +'<p>Розташуй паролі від <b>найменш</b> надійного (1) до <b>найбільш</b> надійного (5), користуючись стрілками.</p>'
    +'<ul class="pw-list" id="pwList">'+itemsHtml+'</ul>'
    +(pwChecked ? '<p class="lede">Правильно розташовано: <b>'+correctCount+' із 5</b>. '+(correctCount===5 ? 'Чудова робота, детективе!' : 'Спробуй ще раз — можна виправити порядок і перевірити знову.')+'</p>' : '')
    +'<div class="btn-row"><button class="btn ghost" data-action="checkpw">Перевірити порядок</button></div>'
    +'<h2 style="margin-top:26px;">Придумай свій надійний пароль</h2>'
    +'<p class="lede">Правило: довгий + великі та малі літери + цифри + символи. <b>Ніколи не вводь тут свій справжній пароль!</b></p>'
    +'<input type="text" id="newpw" placeholder="Придумай новий пароль тут" autocomplete="off" spellcheck="false">'
    +'<ul class="checklist" id="pwChecklist">'+renderChecklist(crit)+'</ul>'
    +'<div class="btn-row">'
      +'<button class="btn gold" id="nextBtn1" data-go="case2" '+(pwChecked && crit.all ? '' : 'disabled')+'>Наступна справа</button>'
    +'</div>';
  }

  function passwordCriteria(v){
    v = v || "";
    var len = v.length >= 8;
    var low = /[a-zа-яіїєґ]/.test(v);
    var up = /[A-ZА-ЯІЇЄҐ]/.test(v);
    var digit = /[0-9]/.test(v);
    var sym = /[^a-zA-Zа-яА-ЯіїєґІЇЄҐ0-9]/.test(v);
    return {len:len, low:low, up:up, digit:digit, sym:sym, all: len&&low&&up&&digit&&sym};
  }
  function renderChecklist(c){
    var items = [
      [c.len, "Довжина від 8 символів"],
      [c.low, "Є малі літери"],
      [c.up, "Є великі літери"],
      [c.digit, "Є цифра"],
      [c.sym, "Є символ (! # @ * тощо)"]
    ];
    return items.map(function(it){
      return '<li class="'+(it[0]?"ok":"")+'"><span class="dot"></span>'+it[1]+'</li>';
    }).join('');
  }

  // ---- CASE 2 ----
  function renderCase2(){
    var answeredCount = Object.keys(msgAnswers).length;
    var itemsHtml = messages.map(function(m){
      var ans = msgAnswers[m.id];
      var answered = ans !== undefined;
      var fbClass = "";
      var fbShow = "";
      if (answered){
        fbClass = (ans === m.danger) ? "good" : "bad";
        fbShow = "show";
      }
      return ''
      +'<div class="msg">'
        +'<p>'+esc(m.text)+'</p>'
        +'<div class="choices">'
          +'<button class="choice-btn pick-safe'+(answered && ans===false ? " chosen-safe" : "")+'" data-msg="'+m.id+'" data-val="safe" '+(answered?"disabled":"")+'>🟢 Безпечно</button>'
          +'<button class="choice-btn pick-danger'+(answered && ans===true ? " chosen-danger" : "")+'" data-msg="'+m.id+'" data-val="danger" '+(answered?"disabled":"")+'>🔴 Небезпечно</button>'
        +'</div>'
        +'<div class="feedback '+fbClass+' '+fbShow+'">'+(answered ? (ans===m.danger ? "✅ Правильно! " : "❌ Ще подумай. ") + m.why : "")+'</div>'
      +'</div>';
    }).join('');

    return ''
    +'<div class="case-tag">СПРАВА №2</div>'
    +'<h1>🎣 Спіймай шахрая</h1>'
    +'<p>Прочитай кожне повідомлення й визнач: воно безпечне чи це пастка шахрая?</p>'
    +itemsHtml
    +'<p class="score-line">Оброблено повідомлень: '+answeredCount+' із '+messages.length+'</p>'
    +'<div class="btn-row"><button class="btn gold" data-go="case3" '+(answeredCount===messages.length ? '' : 'disabled')+'>Наступна справа</button></div>';
  }

  // ---- CASE 3 ----
  function renderCase3(){
    var visibleLines = chatLines.slice(0, chatStep+1);
    var chatHtml = visibleLines.map(function(l){
      if (l.who === "them"){
        return '<div class="who">'+esc(l.name)+'</div><div class="bubble them">'+esc(l.text)+'</div>';
      } else {
        return '<div class="who me-who">'+esc(l.name)+'</div><div class="bubble me">'+esc(l.text)+'</div>';
      }
    }).join('');

    var showQuestion = chatStep >= chatLines.length-1;
    var optsHtml = "";
    if (showQuestion){
      optsHtml = '<h2 style="margin-top:22px;">Що відповісти?</h2>' + chatOptions.map(function(o){
        var cls = "opt-card";
        if (chatAnswered){
          if (o.correct) cls += " correct-pick";
          else if (o.picked) cls += " wrong-pick";
        }
        return '<button class="'+cls+'" data-chatopt="'+o.id+'" '+(chatAnswered?"disabled":"")+'>'+esc(o.text)+'</button>';
      }).join('')
      + (chatAnswered ? '<p class="lede">✅ Незнайомій людині не варто повідомляти свою адресу, школу, номер телефону чи іншу особисту інформацію. Найкраще — припинити спілкування і розповісти дорослому.</p>' : '');
    }

    return ''
    +'<div class="case-tag">СПРАВА №3</div>'
    +'<h1>👤 Хто за екраном?</h1>'
    +'<p>У чаті з'+"'"+'явився незнайомець на ім'+"'"+'я Alex_777. Прочитай листування.</p>'
    +'<div class="chat">'+chatHtml+'</div>'
    +(!showQuestion ? '<div class="btn-row"><button class="btn ghost" data-action="chatnext">Показати далі</button></div>' : '')
    +optsHtml
    +'<div class="btn-row"><button class="btn gold" data-go="case4" '+(chatAnswered ? '' : 'disabled')+'>Наступна справа</button></div>';
  }

  // ---- CASE 4 ----
  function renderCase4(){
    var answeredCount = Object.keys(sitAnswers).length;
    var itemsHtml = situations.map(function(s){
      var ans = sitAnswers[s.id];
      var cls = "sit";
      if (sitChecked){
        cls += (ans === s.safe) ? " result-correct show-hint" : " result-wrong show-hint";
      }
      return ''
      +'<div class="'+cls+'">'
        +'<span>'+esc(s.text)+'</span>'
        +'<div class="sit-btns">'
          +'<button class="mini-btn'+(ans===true?" sel-safe":"")+'" data-sit="'+s.id+'" data-val="safe" '+(sitChecked?"disabled":"")+'>🟢</button>'
          +'<button class="mini-btn'+(ans===false?" sel-danger":"")+'" data-sit="'+s.id+'" data-val="danger" '+(sitChecked?"disabled":"")+'>🔴</button>'
        +'</div>'
        +(sitChecked ? '<div class="sit-hint">'+(s.safe ? "Можна публікувати 🟢" : "Не можна публікувати 🔴")+'</div>' : '')
      +'</div>';
    }).join('');

    var correctCount = situations.filter(function(s){return sitAnswers[s.id] === s.safe;}).length;

    return ''
    +'<div class="case-tag">СПРАВА №4</div>'
    +'<h1>📸 Можна це публікувати?</h1>'
    +'<p>Познач кожну ситуацію: 🟢 можна публікувати в мережі, чи 🔴 не можна.</p>'
    +itemsHtml
    +'<p class="score-line">Позначено: '+answeredCount+' із '+situations.length+(sitChecked ? (' · Правильно: '+correctCount) : '')+'</p>'
    +'<div class="btn-row">'
      +(!sitChecked ? '<button class="btn ghost" data-action="checksit" '+(answeredCount===situations.length?'':'disabled')+'>Перевірити</button>' : '')
      +'<button class="btn gold" data-go="case5" '+(sitChecked ? '' : 'disabled')+'>Наступна справа</button>'
    +'</div>';
  }

  // ---- CASE 5 ----
  function renderCase5(){
    var poolHtml = pool5shuffled.map(function(p){
      var used = slots5.indexOf(p.id) !== -1;
      return '<button class="pool-item'+(used?' used':'')+'" data-pool="'+p.id+'" '+(used||slots5checked?'disabled':'')+'>'+esc(p.text)+'</button>';
    }).join('');

    var slotsHtml = slots5.map(function(id, idx){
      var item = id ? pool5.filter(function(p){return p.id===id;})[0] : null;
      var cls = "slot" + (item ? " filled" : "");
      if (slots5checked && item){
        cls += (item.correct && item.order === idx+1) ? " slot-correct" : " slot-wrong";
      }
      return '<div class="'+cls+'" data-slot="'+idx+'"><span class="num">'+(idx+1)+'️⃣</span><span>'+(item ? esc(item.text) : "Натисни дію зі списку нижче")+'</span></div>';
    }).join('');

    var filledCount = slots5.filter(Boolean).length;

    return ''
    +'<div class="case-tag">СПРАВА №5 · ФІНАЛ</div>'
    +'<h1>🆘 План порятунку</h1>'
    +'<p>Незнайомець просить фото, а потім погрожує й каже нікому не розповідати. Онови правильний порядок дій — натискай картки в потрібній послідовності. Натисни на заповнений рядок, щоб прибрати дію.</p>'
    +'<div class="slots">'+slotsHtml+'</div>'
    +'<div class="pool">'+poolHtml+'</div>'
    +(slots5checked ? '<p class="lede">'+(slots5.every(function(id,idx){return id && pool5.filter(function(p){return p.id===id;})[0].order===idx+1;}) ? "Чудово! Це правильний алгоритм дій." : "Не зовсім так. Правильний порядок: припинити спілкування → зберегти докази → заблокувати → розповісти дорослому.")+'</p>' : '')
    +'<div class="btn-row">'
      +'<button class="btn ghost" data-action="resetslots">Скинути</button>'
      +(!slots5checked ? '<button class="btn ghost" data-action="checkslots" '+(filledCount===4?'':'disabled')+'>Перевірити</button>' : '')
      +'<button class="btn gold" data-go="result" '+(slots5checked ? '' : 'disabled')+'>Завершити розслідування</button>'
    +'</div>';
  }

  // ---- RESULT ----
  function renderResult(){
    var total=0, max=0;
    CASES.forEach(function(c){ total += state.scores[c.n].c; max += state.scores[c.n].t; });
    var pct = max ? Math.round(total/max*100) : 0;
    var rank, rankIcon;
    if (pct >= 90){rank="Кібердетектив-легенда"; rankIcon="👑🕵️";}
    else if (pct >= 70){rank="Досвідчений кібердетектив"; rankIcon="🕵️‍♂️";}
    else if (pct >= 50){rank="Кібердетектив-стажер"; rankIcon="🔍";}
    else {rank="Юний слідчий-початківець"; rankIcon="📚";}

    var badges = CASES.map(function(c){
      var sc = state.scores[c.n];
      return '<div class="badge"><span class="num">'+sc.c+'/'+sc.t+'</span><span class="lbl">'+c.icon+' Справа №'+c.n+'</span></div>';
    }).join('');

    return ''
    +'<div class="case-tag">СПРАВУ ЗАКРИТО</div>'
    +'<h1>🕵️ Досьє детектива'+(state.studentName ? ': '+esc(state.studentName) : '')+'</h1>'
    +'<p class="lede" style="text-align:center;margin-top:-6px;">Час розслідування: '+formatTime(state.elapsedSeconds)+'</p>'
    +'<div class="totalscore">'+total+' / '+max+'<small>правильних рішень</small></div>'
    +'<div class="rank-title" style="text-align:center;">'+rankIcon+' '+rank+'</div>'
    +'<div class="badges">'+badges+'</div>'
    +'<p class="lede" style="text-align:center;">Пам'+"'"+'ятай головні правила: не діли пароль ні з ким, не довіряй незнайомцям особисту інформацію та завжди розповідай дорослим про підозрілі повідомлення.</p>'
    +'<div class="btn-row" style="justify-content:center;"><button class="btn gold" data-action="restart">Пройти розслідування ще раз</button></div>';
  }

  // ---------------- MAIN RENDER ----------------
  function render(){
    renderBoard();
    var screen = document.getElementById("screen");
    var html;
    switch(state.screen){
      case "intro": html = renderIntro(); break;
      case "case1": html = renderCase1(); break;
      case "case2": html = renderCase2(); break;
      case "case3": html = renderCase3(); break;
      case "case4": html = renderCase4(); break;
      case "case5": html = renderCase5(); break;
      case "result": html = renderResult(); break;
    }
    screen.innerHTML = html;
  }

  function scrollToTop(){
    window.scrollTo({top:0, behavior:"smooth"});
  }

  // ---------------- EVENTS ----------------
  document.getElementById("app").addEventListener("click", function(e){
    var t = e.target;

    if (t.closest('[data-action="start"]')){
      var nameInput = document.getElementById("studentName");
      var nameVal = (nameInput.value || "").trim();
      if (!nameVal){
        document.getElementById("nameWarn").classList.add("show");
        nameInput.focus();
        return;
      }
      state.studentName = nameVal;
      state.startTime = Date.now();
      state.screen = "case1";
      render();
      scrollToTop();
      return;
    }

    var goBtn = t.closest("[data-go]");
    if (goBtn){
      var target = goBtn.getAttribute("data-go");
      var curNum = state.screen.match(/^case(\d)$/);
      if (curNum) state.doneCases[curNum[1]] = true;
      state.screen = target;
      if (target === "result"){
        state.finished = true;
        state.elapsedSeconds = state.startTime ? Math.floor((Date.now()-state.startTime)/1000) : 0;
      }
      render();
      scrollToTop();
      if (target === "result"){ submitResults(); }
      return;
    }

    if (t.closest('[data-action="restart"]')){
      location.reload();
      return;
    }

    // case1
    var arrowBtn = t.closest("[data-arrow]");
    if (arrowBtn){
      var id = arrowBtn.getAttribute("data-id");
      var dir = arrowBtn.getAttribute("data-arrow");
      var idx = pwUserOrder.indexOf(id);
      var swapWith = dir === "up" ? idx-1 : idx+1;
      if (swapWith >= 0 && swapWith < pwUserOrder.length){
        var tmp = pwUserOrder[idx];
        pwUserOrder[idx] = pwUserOrder[swapWith];
        pwUserOrder[swapWith] = tmp;
        pwChecked = false;
        render();
      }
      return;
    }
    if (t.closest('[data-action="checkpw"]')){
      pwChecked = true;
      var correctCount = pwUserOrder.filter(function(id,idx){return id===pwCorrectIds[idx];}).length;
      state.scores[1].c = correctCount;
      render();
      return;
    }

    // case2
    var msgBtn = t.closest("[data-msg]");
    if (msgBtn){
      var mid = parseInt(msgBtn.getAttribute("data-msg"),10);
      var val = msgBtn.getAttribute("data-val") === "danger";
      msgAnswers[mid] = val;
      var correct2 = messages.filter(function(m){return msgAnswers[m.id] === m.danger;}).length;
      state.scores[2].c = correct2;
      render();
      return;
    }

    // case3
    if (t.closest('[data-action="chatnext"]')){
      chatStep = Math.min(chatStep+1, chatLines.length-1);
      render();
      return;
    }
    var chatOptBtn = t.closest("[data-chatopt]");
    if (chatOptBtn && !chatAnswered){
      var oid = chatOptBtn.getAttribute("data-chatopt");
      chatOptions.forEach(function(o){ o.picked = (o.id === oid); });
      chatAnswered = true;
      var picked = chatOptions.filter(function(o){return o.id===oid;})[0];
      state.scores[3].c = picked.correct ? 1 : 0;
      render();
      return;
    }

    // case4
    var sitBtn = t.closest("[data-sit]");
    if (sitBtn){
      var sid = parseInt(sitBtn.getAttribute("data-sit"),10);
      var sval = sitBtn.getAttribute("data-val") === "safe";
      sitAnswers[sid] = sval;
      render();
      return;
    }
    if (t.closest('[data-action="checksit"]')){
      sitChecked = true;
      var correct4 = situations.filter(function(s){return sitAnswers[s.id] === s.safe;}).length;
      state.scores[4].c = correct4;
      render();
      return;
    }

    // case5
    var poolBtn = t.closest("[data-pool]");
    if (poolBtn && !slots5checked){
      var pid = poolBtn.getAttribute("data-pool");
      if (slots5.indexOf(pid) === -1){
        var freeIdx = slots5.indexOf(null);
        if (freeIdx !== -1){
          slots5[freeIdx] = pid;
          render();
        }
      }
      return;
    }
    var slotBtn = t.closest("[data-slot]");
    if (slotBtn && !slots5checked){
      var sidx = parseInt(slotBtn.getAttribute("data-slot"),10);
      if (slots5[sidx]){
        slots5[sidx] = null;
        render();
      }
      return;
    }
    if (t.closest('[data-action="resetslots"]')){
      slots5 = [null,null,null,null];
      slots5checked = false;
      render();
      return;
    }
    if (t.closest('[data-action="checkslots"]')){
      slots5checked = true;
      var correct5 = slots5.filter(function(id, idx){
        if (!id) return false;
        var item = pool5.filter(function(p){return p.id===id;})[0];
        return item.correct && item.order === idx+1;
      }).length;
      state.scores[5].c = correct5;
      render();
      return;
    }
  });

  document.getElementById("app").addEventListener("input", function(e){
    if (e.target && e.target.id === "newpw"){
      var crit = passwordCriteria(e.target.value);
      document.getElementById("pwChecklist").innerHTML = renderChecklist(crit);
      var nb = document.getElementById("nextBtn1");
      if (nb) nb.disabled = !(pwChecked && crit.all);
    }
  });

  setInterval(function(){
    if (state.startTime && !state.finished){
      var el = document.getElementById("liveClock");
      if (el){
        el.textContent = formatTime(Math.floor((Date.now()-state.startTime)/1000));
      }
    }
  }, 1000);

  render();
})();
</script>
</body>
</html>
